<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartLearn – Adaptive Education System</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2e;--tx:#eceefa;--mu:#9aa3bd;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2a2f47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--tx:#eceefa;--mu:#9aa3bd;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2a2f47;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mu);margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ac);transition:width .4s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
.tutor{border-left:4px solid var(--ac);padding-left:12px;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.hidden{display:none}
</style></head><body><main>
<div class="row"><div><h1>🎓 SmartLearn</h1><p class="sub" id="hello"></p></div>
<div><input id="name" placeholder="Your name" maxlength="24"></div></div>

<section id="home">
  <div class="card" id="rec"></div>
  <h2>Your mastery</h2>
  <div class="grid" id="topics"></div>
  <div class="card" style="margin-top:14px"><h2>Personalized study plan</h2><div id="plan"></div></div>
  <button id="reset">Reset progress</button>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="row"><span class="tag" id="qmeta"></span><button id="exit">Exit</button></div>
    <h2 id="qtext" style="margin-top:12px"></h2><div id="opts"></div>
    <div id="fb" class="tutor hidden"></div>
    <div style="margin-top:12px"><button class="p hidden" id="next">Next question →</button></div>
  </div>
</section>
</main>
<script>
const Q=[
["Math",1,"What is 7 × 8?",["54","56","64","48"],1,"7×8=56. Tip: 7×8 is 5-6-7-8 → 56 = 7×8."],
["Math",1,"Solve: x + 9 = 15",["x=6","x=24","x=5","x=7"],0,"Subtract 9 from both sides: x = 15 − 9 = 6."],
["Math",2,"What is 15% of 200?",["20","25","30","35"],2,"15% = 0.15, and 0.15 × 200 = 30."],
["Math",2,"Solve: 2x − 5 = 11",["x=3","x=8","x=6","x=16"],1,"Add 5 → 2x=16, divide by 2 → x=8."],
["Math",3,"Roots of x² − 5x + 6 = 0?",["1 and 6","2 and 3","−2 and −3","5 and 1"],1,"Factor: (x−2)(x−3)=0, so x=2 or 3."],
["Math",3,"d/dx of x³ is…",["x²","3x","3x²","x³/3"],2,"Power rule: bring the exponent down, subtract one → 3x²."],
["Science",1,"Chemical formula of water?",["CO₂","H₂O","O₂","NaCl"],1,"Two hydrogen atoms and one oxygen atom: H₂O."],
["Science",1,"Plants absorb which gas for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],2,"Plants take in CO₂ and release O₂."],
["Science",2,"SI unit of force?",["Joule","Watt","Pascal","Newton"],3,"Force is measured in newtons (N) = kg·m/s²."],
["Science",2,"Which organelle is the 'powerhouse' of the cell?",["Nucleus","Ribosome","Mitochondria","Golgi body"],2,"Mitochondria produce most of the cell's ATP."],
["Science",3,"Newton's third law states…",["F=ma","Every action has an equal and opposite reaction","Objects at rest stay at rest","Energy is conserved"],1,"Forces come in pairs acting on different bodies."],
["Science",3,"A solution with pH 3 is…",["Neutral","Basic","Acidic","Pure water"],2,"pH below 7 is acidic; 7 neutral; above 7 basic."],
["Coding",1,"Which symbol starts a comment in Python?",["//","#","--","/*"],1,"Python uses # for single-line comments."],
["Coding",1,"Which keyword starts a loop over a sequence in Python?",["loop","repeat","for","each"],2,"for item in sequence: ... iterates over items."],
["Coding",2,"What does len([1,2,3]) return?",["2","3","4","Error"],1,"len counts items: 3."],
["Coding",2,"Time complexity of binary search?",["O(n)","O(log n)","O(n²)","O(1)"],1,"Each step halves the search space → O(log n)."],
["Coding",3,"Which structure is LIFO?",["Queue","Stack","Array","Graph"],1,"A stack: last in, first out (like a pile of plates)."],
["Coding",3,"Average-case lookup in a hash table?",["O(n)","O(log n)","O(1)","O(n log n)"],2,"Hashing jumps to a bucket directly → O(1) on average."]];
const TOPICS=["Math","Science","Coding"],ICON={Math:"➗",Science:"🔬",Coding:"💻"};
let S={name:"",m:{Math:.2,Science:.2,Coding:.2},seen:[],ans:0,ok:0,hist:[]};
try{const x=localStorage.getItem("smartlearn");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("smartlearn",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let cur=null,topic=null,count=0;
const weakest=()=>TOPICS.slice().sort((a,b)=>S.m[a]-S.m[b])[0];
const level=m=>m<.4?1:m<.7?2:3;
function home(){
  $("quiz").classList.add("hidden");$("home").classList.remove("hidden");
  $("name").value=S.name;$("hello").textContent=S.name?`Welcome back, ${S.name}!`:"Adaptive learning that adjusts to you.";
  const w=weakest(),acc=S.ans?Math.round(100*S.ok/S.ans):0;
  $("rec").innerHTML=`<h2>AI recommendation</h2><p>Your weakest area is <b>${w}</b> (${Math.round(S.m[w]*100)}% mastery). Questions are chosen at difficulty level <b>${level(S.m[w])}</b> to keep you challenged but not overwhelmed.</p><div class="row"><span class="tag">${S.ans} answered · ${acc}% accuracy</span><button class="p" id="go">Start adaptive session</button></div>`;
  $("go").onclick=()=>start(w);
  $("topics").innerHTML=TOPICS.map(t=>{const p=Math.round(S.m[t]*100);return `<div class="card" style="margin:0"><b>${ICON[t]} ${t}</b><div class="bar"><i style="width:${p}%"></i></div><small>${p}% mastery · Level ${level(S.m[t])}</small><div style="margin-top:8px"><button data-t="${t}">Practice</button></div></div>`}).join("");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>start(b.dataset.t));
  const order=TOPICS.slice().sort((a,b)=>S.m[a]-S.m[b]);
  $("plan").innerHTML="<ol style='margin:0;padding-left:20px'>"+order.map((t,i)=>{const m=S.m[t];return `<li><b>${t}</b>: ${m<.4?"Rebuild fundamentals — 15 min daily on level-1 concepts.":m<.7?"Strengthen — mix of level 2 problems, 10 min daily.":"Stretch — tackle level 3 challenges, 10 min every other day."}${i===0?" <span class='tag'>priority</span>":""}</li>`}).join("")+"</ol>";
}
function pick(){
  const L=level(S.m[topic]);
  let pool=Q.map((q,i)=>[q,i]).filter(([q,i])=>q[0]===topic&&q[1]===L&&i!==cur);
  const fresh=pool.filter(([q,i])=>!S.seen.includes(i));
  if(!fresh.length){S.seen=S.seen.filter(i=>Q[i][0]!==topic);}
  pool=(fresh.length?fresh:pool);
  if(!pool.length)pool=Q.map((q,i)=>[q,i]).filter(([q])=>q[0]===topic);
  return pool[Math.floor(Math.random()*pool.length)][1];
}
function start(t){topic=t;count=0;$("home").classList.add("hidden");$("quiz").classList.remove("hidden");ask()}
function ask(){
  cur=pick();const q=Q[cur];count++;
  $("qmeta").textContent=`${ICON[topic]} ${topic} · Level ${q[1]} · Q${count}`;
  $("qtext").textContent=q[2];$("fb").classList.add("hidden");$("next").classList.add("hidden");
  $("opts").innerHTML="";
  q[3].forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(i);$("opts").appendChild(b)});
}
function answer(i){
  const q=Q[cur],right=i===q[4],bs=$("opts").children;
  [...bs].forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add("ok");else if(k===i)b.classList.add("bad")});
  const m=S.m[topic];S.m[topic]=Math.min(1,Math.max(0,right?m+(1-m)*(.15+.05*q[1]):m-m*(.25-.03*q[1])));
  S.ans++;if(right)S.ok++;if(!S.seen.includes(cur))S.seen.push(cur);save();
  const m2=S.m[topic],msg=right?(m2>.7?"Excellent — you're close to mastering this topic.":"Correct! Difficulty will rise as you improve."):"Not quite — don't worry, the next question will reinforce this.";
  $("fb").innerHTML=`<b>${right?"✅ Correct":"❌ Incorrect"}</b><p style="margin:6px 0">🤖 <b>AI Tutor:</b> ${q[5]}</p><small>${msg} Mastery: ${Math.round(m2*100)}% (Level ${level(m2)})</small>`;
  $("fb").classList.remove("hidden");$("next").classList.remove("hidden");
}
$("next").onclick=ask;$("exit").onclick=home;
$("name").oninput=e=>{S.name=e.target.value;save();$("hello").textContent=S.name?`Welcome back, ${S.name}!`:"Adaptive learning that adjusts to you."};
$("reset").onclick=()=>{S={name:S.name,m:{Math:.2,Science:.2,Coding:.2},seen:[],ans:0,ok:0,hist:[]};save();home()};
home();
</script></body></html>
